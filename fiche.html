<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches de bataille — Édition</title><style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:#f7f5fc;font:14px system-ui,sans-serif}.bar{background:#252b39;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar b{font-size:15px}button{background:#56638b;color:white;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#7182ad}button.danger{background:#87434d}button.secondary{background:#42495d}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.note{padding:12px 16px;color:#b7bed0}.card{position:absolute;left:24px;top:102px;width:min(370px,calc(100vw - 20px));background:#292d3a;border:1px solid #a4a9c1;border-radius:12px;box-shadow:0 12px 30px #0009;overflow:hidden}.head{background:#514e6c;padding:11px;cursor:move;user-select:none;display:flex;justify-content:space-between;align-items:center;gap:6px}.head span{display:flex;align-items:center;gap:6px}.body{padding:12px;max-height:72vh;overflow:auto}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{background:#383e50;padding:8px 4px;border-radius:6px;text-align:center;font-size:11px}.stat b{display:block;font-size:17px;margin-top:3px}h3{color:#c6b2ff;font-size:14px;margin:15px 0 7px}.hp{display:flex;align-items:center;gap:9px}.hp strong{font-size:19px}.item{padding:10px;background:#373d50;border-radius:7px;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.item p{margin:5px 0 0;line-height:1.45}small{color:#d0d2de}.hidden{display:none!important}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}label{font-size:12px;color:#d3c5ff}input,textarea,select{width:100%;background:#181c29;color:#fff;border:1px solid #66708a;border-radius:6px;padding:8px;font:inherit}textarea{resize:vertical;min-height:60px}.editorItem{border:1px solid #525b74;padding:9px;border-radius:7px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:7px}.sectionActions{display:flex;gap:7px;margin:10px 0}.hint{font-size:12px;color:#c5c7d4;margin-top:12px}.empty{color:#aeb6ca;font-style:italic}.badge{color:#ddd3ff;font-size:12px}.legend-title{color:#f5c451}.legend-item{border:1px solid #d8a640;background:#40392e}.legend-item b{color:#ffe099}.transform-title{color:#ff727e}.transform-item{border:1px solid #b94b5a;background:#442b37}.transform-item b{color:#ffb6bd}.transform-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.transform-actions button{background:#a33e54}.transform-actions button.secondary{background:#42495d}.transform-state{color:#ffb9c1;font-size:12px}.transform-editor{border:1px solid #a33e54;background:#382735;padding:10px;border-radius:8px;margin:10px 0}.transform-editor h4{margin:8px 0;color:#ffb6bd}.transform-editor .field{margin:8px 0}
@media(max-width:500px){.note{padding:6px 12px;font-size:11px}.bar{padding:8px}.card{box-shadow:none}.head{cursor:default}}

/* V4.1 : identité visuelle de la forme transformée */
.transform-sheet .stat{background:#582f3d;border:1px solid #a65064;color:#ffe0e5}
.transform-sheet .item:not(.transform-legend-item){background:#4c2d3a;border:1px solid #a65064}
.transform-sheet h3{color:#ff8796}
.transform-sheet .transform-legend-title{color:#64eff3}

.hp-track{height:12px;background:#171b27;border-radius:20px;overflow:hidden;border:1px solid #656b7c;margin:8px 0 10px}.hp-fill{height:100%;background:var(--hp-color,#e14e65);transition:width .2s}.color-editor{padding:10px;border:1px solid #596077;border-radius:8px;margin:10px 0}.color-editor .field{margin:7px 0}.color-editor select{max-width:100%}
</style></head><body><div class="bar"><b>⚔️ Fiche de personnage</b><div class="toolbar"><button id="export" class="secondary">Exporter sauvegarde</button><button id="import" class="secondary">Importer sauvegarde</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div></div><div class="note" id="status">Chargement de la fiche du pion…</div><section class="card" id="sheet"><div class="head" id="drag"><b id="heading">🌊 TANJIRO KAMADO</b><span><small id="points">50 pts</small><button id="edit" title="Modifier la fiche">✏️</button><button id="close" title="Fermer">×</button></span></div><div class="body"><div id="view"></div><div id="editor" class="hidden"></div></div></section><script>
const initial={name:'Tanjiro Kamado',icon:'🌊',role:'Combattant',subtitle:"Souffle de l'Eau",points:50,hpMax:5,hp:5,endurance:'4',save:'4+',invul:'5+',move:'6 in',control:'1',attacks:[{name:'Lame du courant',description:'5 attaques • Touche 3+ • F6 • PA −2 • D2'}],abilities:[],passives:[],legendary:[{name:'Flux constant',description:"Une fois par bataille : relance des jets pour toucher ratés d’une attaque."}],transformations:[],activeTransformation:null,customStats:[],team:'none',showMapHp:false};
const key='owlbear_fiches_v2_tanjiro';let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)};if(!Array.isArray(data.passives))data.passives=[];if(!Array.isArray(data.legendary))data.legendary=[];if(!Array.isArray(data.customStats))data.customStats=[];if(!Array.isArray(data.abilities))data.abilities=[];if(!Array.isArray(data.transformations))data.transformations=[];if(data.activeTransformation===undefined)data.activeTransformation=null;if(data.abilities.length){const old=data.abilities.filter(a=>/légendaire/i.test(a.type||''));for(const a of old){if(!data.legendary.some(b=>b.name===a.name))data.legendary.push({name:a.name,description:a.description})}data.abilities=data.abilities.filter(a=>!/légendaire/i.test(a.type||''))};let editing=false;let transformationEdit=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let obr=null, tokenId=new URLSearchParams(location.search).get('item'), writeTimer=null;
function save(){
  if(obr&&tokenId){clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{await obr.scene.items.updateItems([tokenId],items=>{if(items[0])items[0].metadata['fr.arene.fiches/data']=JSON.parse(JSON.stringify(data))});document.querySelector('#status').textContent='✓ Fiche enregistrée sur le pion dans Owlbear Rodeo';}catch(e){document.querySelector('#status').textContent='⚠ Enregistrement impossible : '+e.message}},350)}
  else{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Sauvegarde locale indisponible : utilise Exporter sauvegarde.')}}
}
const TEAM_COLORS={none:'#9ba4b8',red:'#e85065',blue:'#4b9cf5',green:'#4fcb87',yellow:'#efc84c',purple:'#a87bf5',orange:'#f3974f'};
const COLOR_SECTIONS=[['stats','Caractéristiques'],['attacks','Attaques'],['passives','Passifs'],['abilities','Capacités'],['legendary','Actions légendaires'],['transformations','Transformations'],['hp','Barre de PV']];
const COLOR_PRESETS=[['default','Par défaut'],['none','Aucune couleur'],['#e35b70','Rouge'],['#29d5e5','Turquoise'],['#9c78f2','Violet'],['#e5b84c','Doré'],['#4fc99b','Vert'],['#f18b4b','Orange'],['#5c8ef2','Bleu']];
function selectedColor(profile,kind){return (profile?.colors||{})[kind]||'default'}
function sectionStyle(profile,kind){const c=selectedColor(profile,kind);if(c==='default')return '';if(c==='none')return 'style="background:transparent!important;border-color:transparent!important;color:inherit!important"';return `style="background:${c}24!important;border:1px solid ${c}!important;color:${c}!important"`}
function coloredTitle(profile,kind){const c=selectedColor(profile,kind);return c==='none'?'style="color:#dce2ee!important"':c==='default'?'':`style="color:${c}!important"`}
function hpBar(profile,max,now){const m=Math.max(0,Number(max)||0),n=Math.max(0,Number(now)||0),pct=m?Math.max(0,Math.min(100,n/m*100)):0;const c=selectedColor(profile,'hp');const color=c==='none'?'#aeb7c8':c==='default'?'#e14e65':c;return `<div class="hp-track" style="--hp-color:${color}"><div class="hp-fill" style="width:${pct}%"></div></div>`}
function colorEditor(profile,scope){return `<div class="color-editor"><h4>🎨 Couleurs de cette fiche uniquement</h4><p class="hint">Par défaut = présentation habituelle. Aucune couleur = neutre.</p>${COLOR_SECTIONS.map(([id,name])=>`<div class="field"><label>${name}</label><select data-color-scope="${scope}" data-color-kind="${id}">${COLOR_PRESETS.map(([value,label])=>`<option value="${value}" ${selectedColor(profile,id)===value?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}</div>`}
function bindColors(root){root.querySelectorAll('[data-color-kind]').forEach(el=>el.onchange=()=>{const scope=el.dataset.colorScope;const profile=scope==='normal'?data:data.transformations[Number(scope)];profile.colors=profile.colors||{};profile.colors[el.dataset.colorKind]=el.value;save()})}
async function syncAppearance(transformation){if(!obr||!tokenId)return;try{const key='arene.multivers.apparences/v1';const arr=await obr.scene.items.getItems([tokenId]);const item=arr[0],d=item?.metadata?.[key];if(!d?.original?.image)return;let v=transformation?(d.variants||[]).find(x=>x.id===transformation.appearanceId)|| (d.variants||[]).find(x=>x.name?.trim().toLowerCase()===transformation.name?.trim().toLowerCase()):{id:'original',image:d.original.image};if(!v?.image)return;await obr.scene.items.updateItems([tokenId],items=>{for(const x of items){x.image={...v.image};x.metadata[key]={...d,active:v.id}}})}catch(e){console.warn('Apparence non synchronisée',e)}}
function render(){ $('#teamSelect').value=data.team||'none';$('#teamDot').style.background=TEAM_COLORS[data.team||'none']||'#9ba4b8'; $('#heading').textContent=(data.icon||'⚔️')+' '+data.name.toUpperCase();$('#points').textContent=data.points+' pts';$('#edit').textContent=editing?'✓':'✏️';$('#view').classList.toggle('hidden',editing);$('#editor').classList.toggle('hidden',!editing);if(editing){renderEditor();return}const activeIdx=data.transformations.findIndex(t=>t.id===data.activeTransformation);if(activeIdx>=0){showTransformSheet(activeIdx);return}$('#view').innerHTML=`<p>${esc(data.role)} • ${esc(data.subtitle)}</p>${hpBar(data,data.hpMax,data.hp)}<div class="hp"><button id="minus">−</button><strong>${data.hp} / ${data.hpMax} PV</strong><button id="plus">+</button></div><h3 ${coloredTitle(data,"stats")}>Caractéristiques</h3><div class="stats">${[['Endurance',data.endurance],['Sauvegarde',data.save],['Invulnérable',data.invul],['Mouvement',data.move],['Contrôle',data.control],['Coût',data.points+' pts'],...data.customStats.map(a=>[a.name,a.value])].map(([n,v])=>`<div class="stat" ${sectionStyle(data,"stats")}>${n}<b>${esc(v)}</b></div>`).join('')}</div><h3 ${coloredTitle(data,"attacks")}>⚔️ Attaques</h3>${data.attacks.length?data.attacks.map(a=>`<div class="item" ${sectionStyle(data,"attacks")}><b>${esc(a.name)}</b><p>${esc(a.description)}</p></div>`).join(''):'<p class="empty">Aucune attaque</p>'}<h3 ${coloredTitle(data,"passives")}>🟣 Passifs</h3>${data.passives.length?data.passives.map(a=>`<div class="item" ${sectionStyle(data,"passives")}><b>${esc(a.name)}</b><p>${esc(a.description)}</p></div>`).join(''):'<p class="empty">Aucun passif</p>'}<h3 ${coloredTitle(data,"abilities")}>✨ Capacités</h3>${data.abilities.length?data.abilities.map(a=>`<div class="item" ${sectionStyle(data,"abilities")}><small>${esc(a.type||'Capacité')}</small><br><b>${esc(a.name)}</b><p>${esc(a.description)}</p></div>`).join(''):'<p class="empty">Aucune capacité</p>'}<h3 class="legend-title" ${coloredTitle(data,"legendary")}>🌟 Actions légendaires</h3>${data.legendary.length?data.legendary.map(a=>`<div class="item legend-item" ${sectionStyle(data,"legendary")}><b>${esc(a.name)}</b><p>${esc(a.description)}</p></div>`).join(''):'<p class="empty">Aucune action légendaire</p>'}<h3 class="transform-title" ${coloredTitle(data,"transformations")}>🔴 TRANSFORMATIONS</h3>${renderTransformList()}<p class="hint">✏️ pour modifier la fiche et les transformations.</p>`;bindTransformButtons();$('#minus').onclick=()=>{data.hp=Math.max(0,(Number(data.hp)||0)-1);save();render()};$('#plus').onclick=()=>{data.hp=Math.min(Number(data.hpMax)||0,(Number(data.hp)||0)+1);save();render()}}
const field=(label,k,wide=false,type='text')=>`<div class="field ${wide?'wide':''}"><label>${label}</label><input data-key="${k}" type="${type}" ${type==='number'?'min="0"':''} value="${esc(data[k])}"></div>`;
function renderEditor(){const ed=$('#editor');ed.innerHTML=`<h3>✏️ Modifier le personnage</h3><div class="editgrid">${field('Nom','name',true)}${field('Emoji','icon')}${field('Rôle','role')}${field('Sous-titre','subtitle',true)}${field('Coût (points)','points',false,'number')}${field('PV maximum','hpMax')}${field('PV actuels','hp')}${field('Endurance','endurance')}${field('Sauvegarde','save')}${field('Invulnérable','invul')}${field('Mouvement','move')}${field('Contrôle','control')}</div><div class="editorItem"><label><input type="checkbox" id="showMapHp" style="width:auto" ${data.showMapHp?'checked':''}> Afficher la barre de PV sous le pion (bêta)</label><p class="hint">Active-la seulement après avoir masqué l’ancienne barre de PV. Elle suit le pion et se synchronise avec cette fiche.</p></div>${colorEditor(data,"normal")}<h3>➕ Attributs personnalisés</h3><div id="customStatsEdit"></div><button id="addStat">+ Ajouter un attribut</button><h3>⚔️ Attaques</h3><div id="attacksEdit"></div><button id="addAttack">+ Ajouter une attaque</button><h3>🟣 Passifs</h3><div id="passivesEdit"></div><button id="addPassive">+ Ajouter un passif</button><h3>✨ Capacités</h3><div id="abilitiesEdit"></div><button id="addAbility">+ Ajouter une capacité</button><h3 class="legend-title">🌟 Actions légendaires</h3><div id="legendaryEdit"></div><button id="addLegendary">+ Ajouter une action légendaire</button><h3 class="transform-title">🔴 TRANSFORMATIONS</h3><p class="hint">Chaque transformation possède sa propre fiche. Les champs peuvent rester vides tant que les caractéristiques ne sont pas décidées.</p><div id="transformsEdit"></div><button id="addTransform">+ Ajouter une transformation</button><div class="sectionActions"><button id="done">✓ Enregistrer et terminer</button></div><p class="hint">Les PV maximum et actuels sont des champs libres, comme Endurance. Les boutons + et − restent utilisables avec des PV numériques. Pense à exporter régulièrement une sauvegarde JSON.</p>`;ed.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.key;data[k]=el.type==='number'?Math.max(0,Number(el.value)||0):el.value;save();$('#heading').textContent=(data.icon||'⚔️')+' '+data.name.toUpperCase();$('#points').textContent=data.points+' pts'}));bindColors(ed);renderCollection('attacks');renderCollection('passives');renderCollection('abilities');renderCollection('legendary');renderStats();renderTransformEditor();$('#addTransform').onclick=()=>{data.transformations.push({id:'t'+Date.now()+Math.random().toString(36).slice(2),name:'Nouvelle transformation',condition:'',duration:'',role:'',subtitle:'',stats:{},attacks:[],abilities:[],passives:[],legendary:[]});transformationEdit=data.transformations.length-1;save();renderEditor()};$('#addStat').onclick=()=>{data.customStats.push({name:'Nouvel attribut',value:'0'});save();renderEditor()};$('#addPassive').onclick=()=>{data.passives.push({name:'Nouveau passif',description:'Description du passif'});save();renderEditor()};$('#addLegendary').onclick=()=>{data.legendary.push({name:'Nouvelle action légendaire',description:'Une fois par bataille : ...'});save();renderEditor()};$('#addAttack').onclick=()=>{data.attacks.push({name:'Nouvelle attaque',description:'Portée • Attaques • Touche • Force • PA • Dégâts'});save();renderEditor()};$('#addAbility').onclick=()=>{data.abilities.push({name:'Nouvelle capacité',type:'Spéciale',description:'Décris ici la capacité et ses limites.'});save();renderEditor()};$('#showMapHp').onchange=e=>{data.showMapHp=e.target.checked;save()};$('#done').onclick=()=>{editing=false;save();render()}}
function renderStats(){const root=$('#customStatsEdit');root.innerHTML=data.customStats.map((a,i)=>`<div class="editorItem"><div class="row"><b>Attribut ${i+1}</b><button class="danger" data-delete="${i}">Supprimer</button></div><div class="editgrid"><div class="field"><label>Nom</label><input data-idx="${i}" data-prop="name" value="${esc(a.name)}"></div><div class="field"><label>Valeur</label><input data-idx="${i}" data-prop="value" value="${esc(a.value)}"></div></div></div>`).join('');root.querySelectorAll('[data-prop]').forEach(el=>el.oninput=()=>{data.customStats[Number(el.dataset.idx)][el.dataset.prop]=el.value;save()});root.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{data.customStats.splice(Number(el.dataset.delete),1);save();renderEditor()})}
function renderCollection(kind){const root=$('#'+kind+'Edit');root.innerHTML=data[kind].map((a,i)=>`<div class="editorItem"><div class="row"><b>${kind==='attacks'?'Attaque':kind==='passives'?'Passif':kind==='legendary'?'Action légendaire':'Capacité'} ${i+1}</b><button class="danger" data-delete="${i}">Supprimer</button></div><div class="field"><label>Nom</label><input data-idx="${i}" data-prop="name" value="${esc(a.name)}"></div>${kind==='abilities'?`<div class="field"><label>Type (passif, bonus, légendaire…)</label><input data-idx="${i}" data-prop="type" value="${esc(a.type||'')}"></div>`:''}<div class="field"><label>Description / caractéristiques</label><textarea data-idx="${i}" data-prop="description">${esc(a.description)}</textarea></div></div>`).join('');root.querySelectorAll('[data-prop]').forEach(el=>el.addEventListener('input',()=>{data[kind][Number(el.dataset.idx)][el.dataset.prop]=el.value;save()}));root.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{if(confirm('Supprimer cet élément ?')){data[kind].splice(Number(el.dataset.delete),1);save();renderEditor()}})}

function currentTransform(){return data.transformations.find(t=>t.id===data.activeTransformation)||null}
function renderTransformList(){
 const active=currentTransform();
 return `${active?`<p class="transform-state">● Fiche active : ${esc(active.name)}</p><div class="transform-actions"><button id="backNormal">↩ Revenir à la fiche normale</button></div>`:''}${data.transformations.length?data.transformations.map((t,i)=>`<div class="item transform-item" ${sectionStyle(data,"transformations")}><b>${esc(t.name||'Transformation '+(i+1))}</b><p>${esc(t.condition||'Condition à définir')}</p><small>Durée : ${esc(t.duration||'à définir')}</small><div class="transform-actions"><button data-transform-open="${i}">${active&&active.id===t.id?'Voir la fiche active':'Voir la fiche'}</button><button data-transform-activate="${i}" ${active&&active.id===t.id?'disabled':''}>${active&&active.id===t.id?'✓ Active':'Activer la fiche'}</button></div></div>`).join(''):'<p class="empty">Aucune transformation enregistrée. Ajoute-en depuis ✏️.</p>'}`;
}
function bindTransformButtons(){
 $('#view').querySelectorAll('[data-transform-open]').forEach(b=>b.onclick=()=>showTransformSheet(Number(b.dataset.transformOpen)));
 $('#view').querySelectorAll('[data-transform-activate]').forEach(b=>b.onclick=()=>{const t=data.transformations[Number(b.dataset.transformActivate)];if(!t)return;activateTransform(Number(b.dataset.transformActivate))});
 const back=$('#backNormal');if(back)back.onclick=()=>{returnNormal()};
}
function hpPolicy(t, phase){
 const mode=(phase==='start'?t.hpOnStart:t.hpOnEnd)||'keep';
 const val=Number(phase==='start'?t.hpStartValue:t.hpEndValue)||0;
 const current=Number(data.hp)||0;
 const max=Number(phase==='start'?(t.stats||{}).hpMax:data.hpMax)||Number(data.hpMax)||0;
 if(phase==='start'){t.hpBeforeTransformation=current}
 let next=current;
 if(mode==='heal')next=current+Math.max(0,val);
 if(mode==='full')next=max;
 if(mode==='fixed')next=val;
 if(mode==='restore'&&phase==='end')next=Number(t.hpBeforeTransformation??current);
 if(mode==='keep')return;
 data.hp=Math.max(0,Math.min(next,max));
}
function activateTransform(i){const t=data.transformations[i];if(!t)return;if(data.activeTransformation&&data.activeTransformation!==t.id){alert('Reviens d’abord à la forme normale.');return}if(data.activeTransformation!==t.id){hpPolicy(t,'start');data.activeTransformation=t.id;save();syncAppearance(t)}showTransformSheet(i)}
function returnNormal(){const t=currentTransform();if(t)hpPolicy(t,'end');data.activeTransformation=null;save();syncAppearance(null);render()}
function showTransformSheet(i){
 const t=data.transformations[i];if(!t)return;
 const stats=t.stats||{};
 const isActive=data.activeTransformation===t.id;
 const currentHp=Number(data.hp)||0;
 const maxHp=Number(stats.hpMax)||Number(data.hpMax)||0;
 $('#view').innerHTML=`<div class="transform-sheet"><button id="returnMain" class="secondary">← Retour aux transformations</button><h3 class="transform-title">🔴 ${esc(t.name)}</h3><p>${esc(t.role||data.role)} ${t.subtitle?'• '+esc(t.subtitle):''}</p><p><b>Condition :</b> ${esc(t.condition||'À définir')}<br><b>Durée :</b> ${esc(t.duration||'À définir')}</p>${isActive?`<p class="transform-state">● TRANSFORMATION ACTIVE</p>`:''}<h3 class="transform-title" ${coloredTitle(t,"stats")}>Caractéristiques transformées</h3><div class="stats">${[['Mouvement',stats.move],['Endurance',stats.endurance],['Sauvegarde',stats.save],['Invulnérable',stats.invul],['PV maximum',stats.hpMax],['PV actuels',isActive?data.hp:(stats.hp||'—')],['Contrôle',stats.control],...(t.customStats||[]).map(a=>[a.name,a.value])].map(([n,v])=>`<div class="stat" ${sectionStyle(t,"stats")}>${esc(n)}<b>${esc(v??'—')}</b></div>`).join('')}</div>${isActive?`<div class="transform-hp">${hpBar(t,maxHp,data.hp)}<b>PV actuels : ${esc(data.hp)} / ${esc(maxHp)}</b><div class="transform-actions"><button id="thpminus">− 1 PV</button><button id="thpplus">+ 1 PV</button></div></div>`:''}<h3 ${coloredTitle(t,"attacks")}>⚔️ Attaques</h3>${renderTransformItems(t.attacks,false,t,"attacks")}<h3 ${coloredTitle(t,"passives")}>🟣 Passifs</h3>${renderTransformItems(t.passives,false,t,"passives")}<h3 ${coloredTitle(t,"abilities")}>✨ Capacités</h3>${renderTransformItems(t.abilities,false,t,"abilities")}<h3 class="transform-legend-title" ${coloredTitle(t,"legendary")}>🌟 Actions légendaires</h3>${renderTransformItems(t.legendary,true,t,"legendary")}<div class="transform-actions"><button id="activateHere">${isActive?'✓ Fiche active':'Activer cette fiche'}</button><button id="normalHere" class="secondary">↩ Fiche normale</button></div></div>`;
 $('#returnMain').onclick=()=>{if(isActive){returnNormal()}else render()};
 $('#activateHere').onclick=()=>activateTransform(i);
 $('#normalHere').onclick=()=>returnNormal();
 if(isActive){$('#thpminus').onclick=()=>{data.hp=Math.max(0,(Number(data.hp)||0)-1);save();showTransformSheet(i)};$('#thpplus').onclick=()=>{data.hp=Math.min(maxHp,(Number(data.hp)||0)+1);save();showTransformSheet(i)}}
}
function renderTransformItems(items,legend=false,profile=null,kind="attacks"){return Array.isArray(items)&&items.length?items.map(a=>`<div class="item ${legend?'transform-legend-item':''}" ${sectionStyle(profile,kind)}><b>${esc(a.name)}</b><p>${esc(a.description)}</p></div>`).join(''):'<p class="empty">À définir</p>'}
function renderTransformEditor(){
 const root=$('#transformsEdit');
 root.innerHTML=data.transformations.map((t,i)=>`<div class="transform-editor"><div class="row"><b>🔴 ${esc(t.name||'Transformation '+(i+1))}</b><div class="toolbar"><button class="secondary" data-tedit="${i}">${transformationEdit===i?'Réduire':'Modifier'}</button><button class="danger" data-tdelete="${i}">Supprimer</button></div></div>${transformationEdit===i?`<div class="field"><label>Nom</label><input data-ti="${i}" data-tprop="name" value="${esc(t.name)}"></div><div class="field"><label>Condition d'activation</label><textarea data-ti="${i}" data-tprop="condition">${esc(t.condition||'')}</textarea></div><div class="field"><label>Durée</label><input data-ti="${i}" data-tprop="duration" value="${esc(t.duration||'')}" placeholder="Ex. 1 manche"></div><div class="field"><label>Rôle (facultatif)</label><input data-ti="${i}" data-tprop="role" value="${esc(t.role||'')}"></div><div class="field"><label>Sous-titre</label><input data-ti="${i}" data-tprop="subtitle" value="${esc(t.subtitle||'')}"></div>${colorEditor(t,String(i))}<h4>🖼️ Apparence liée (facultatif)</h4><p class="hint">Pour un changement automatique, donne à l’apparence dans l’extension Transformations le même nom que cette transformation. Sinon, sélectionne-la par son identifiant (option avancée).</p><div class="field"><label>ID de l’apparence Owlbear (facultatif)</label><input data-ti="${i}" data-tprop="appearanceId" value="${esc(t.appearanceId||'')}" placeholder="Laisser vide pour associer par nom"></div><h4>Statistiques de la nouvelle fiche</h4><div class="editgrid">${[['move','Mouvement'],['endurance','Endurance'],['save','Sauvegarde'],['invul','Invulnérable'],['hpMax','PV maximum'],['hp','PV actuels (indication)'],['control','Contrôle']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-ti="${i}" data-tstat="${k}" value="${esc((t.stats||{})[k]||'')}" placeholder="À définir"></div>`).join('')}</div><h4>➕ Caractéristiques personnalisées</h4>${(t.customStats||[]).map((a,j)=>`<div class="custom-transform-stat"><div class="row"><b>Caractéristique ${j+1}</b><button class="danger" data-tcustom-remove="${i}:${j}">Supprimer</button></div><div class="editgrid"><div class="field"><label>Nom</label><input data-tcustom="${i}:${j}:name" value="${esc(a.name)}"></div><div class="field"><label>Valeur</label><input data-tcustom="${i}:${j}:value" value="${esc(a.value)}"></div></div></div>`).join('')}<button class="secondary" data-tcustom-add="${i}">+ Ajouter une caractéristique</button><h4>Gestion des PV (facultative)</h4><p class="hint">Par défaut : aucun soin automatique. Règles indépendantes pour l'activation et le retour.</p>${[['start','À l’activation'],['end','Au retour à la normale']].map(([phase,title])=>`<div class="field"><label>${title}</label><select data-thp-mode="${i}:${phase}">${[['keep','Conserver les PV actuels'],['heal','Soigner un nombre de PV'],['full','Remplir les PV au maximum'],['fixed','Fixer les PV actuels'],...(phase==='end'?[['restore','Restaurer les PV avant transformation']]:[])].map(([v,label])=>`<option value="${v}" ${((phase==='start'?t.hpOnStart:t.hpOnEnd)||'keep')===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label>Valeur (pour soin ou PV fixes)</label><input type="number" min="0" data-thp-value="${i}:${phase}" value="${esc((phase==='start'?t.hpStartValue:t.hpEndValue)??'0')}"></div>`).join('')}${['attacks','passives','abilities','legendary'].map(kind=>`<h4>${{attacks:'⚔️ Attaques',passives:'🟣 Passifs',abilities:'✨ Capacités',legendary:'🌟 Actions légendaires'}[kind]}</h4>${(t[kind]||[]).map((a,j)=>`<div class="editorItem"><div class="row"><b>Élément ${j+1}</b><button class="danger" data-trm="${i}:${kind}:${j}">Supprimer</button></div><div class="field"><label>Nom</label><input data-titem="${i}:${kind}:${j}:name" value="${esc(a.name)}"></div><div class="field"><label>Description</label><textarea data-titem="${i}:${kind}:${j}:description">${esc(a.description)}</textarea></div></div>`).join('')}<button class="secondary" data-tadd="${i}:${kind}">+ Ajouter</button>`).join('')}`:''}</div>`).join('');
 bindColors(root);root.querySelectorAll('[data-tcustom-add]').forEach(b=>b.onclick=()=>{const t=data.transformations[Number(b.dataset.tcustomAdd)];t.customStats=t.customStats||[];t.customStats.push({name:'Nouvelle caractéristique',value:''});save();renderTransformEditor()});
 root.querySelectorAll('[data-tcustom-remove]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.tcustomRemove.split(':').map(Number);data.transformations[i].customStats.splice(j,1);save();renderTransformEditor()});
 root.querySelectorAll('[data-tcustom]').forEach(el=>el.oninput=()=>{const [i,j,k]=el.dataset.tcustom.split(':');data.transformations[Number(i)].customStats[Number(j)][k]=el.value;save()});
 root.querySelectorAll('[data-thp-mode]').forEach(el=>el.onchange=()=>{const [i,phase]=el.dataset.thpMode.split(':');data.transformations[Number(i)][phase==='start'?'hpOnStart':'hpOnEnd']=el.value;save()});
 root.querySelectorAll('[data-thp-value]').forEach(el=>el.oninput=()=>{const [i,phase]=el.dataset.thpValue.split(':');data.transformations[Number(i)][phase==='start'?'hpStartValue':'hpEndValue']=el.value;save()});
 root.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>{transformationEdit=transformationEdit===Number(b.dataset.tedit)?null:Number(b.dataset.tedit);renderTransformEditor()});
 root.querySelectorAll('[data-tdelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.tdelete);if(!confirm('Supprimer cette transformation et sa fiche ?'))return;const id=data.transformations[i].id;data.transformations.splice(i,1);if(data.activeTransformation===id)data.activeTransformation=null;transformationEdit=null;save();renderTransformEditor()});
 root.querySelectorAll('[data-tprop]').forEach(el=>el.oninput=()=>{data.transformations[Number(el.dataset.ti)][el.dataset.tprop]=el.value;save()});
 root.querySelectorAll('[data-tstat]').forEach(el=>el.oninput=()=>{const t=data.transformations[Number(el.dataset.ti)];t.stats=t.stats||{};t.stats[el.dataset.tstat]=el.value;save()});
 root.querySelectorAll('[data-tadd]').forEach(b=>b.onclick=()=>{const [i,kind]=b.dataset.tadd.split(':');const t=data.transformations[Number(i)];t[kind]=t[kind]||[];t[kind].push({name:'',description:''});save();renderTransformEditor()});
 root.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{const [i,kind,j]=b.dataset.trm.split(':');data.transformations[Number(i)][kind].splice(Number(j),1);save();renderTransformEditor()});
 root.querySelectorAll('[data-titem]').forEach(el=>el.oninput=()=>{const [i,kind,j,prop]=el.dataset.titem.split(':');data.transformations[Number(i)][kind][Number(j)][prop]=el.value;save()});
}

const teamControl=document.createElement('span');teamControl.style.cssText='display:inline-flex;align-items:center;gap:5px;margin-left:6px';teamControl.innerHTML='<span id="teamDot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ba4b8"></span><select id="teamSelect" title="Équipe du personnage" style="width:92px;padding:3px;font-size:11px"><option value="none">Équipe : —</option><option value="red">Rouge</option><option value="blue">Bleu</option><option value="green">Vert</option><option value="yellow">Jaune</option><option value="purple">Violet</option><option value="orange">Orange</option></select>';$('#heading').parentElement.appendChild(teamControl);$('#teamSelect').onchange=e=>{data.team=e.target.value;save();render()};
$('#edit').onclick=()=>{editing=!editing;save();render()};$('#close').onclick=async()=>{if(obr&&tokenId)await obr.popover.close('fr.arene.fiches/pion-'+tokenId);else $('#sheet').classList.add('hidden')};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fiche_personnage.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.attacks)||!Array.isArray(d.abilities)||typeof d.name!=='string'||d.hpMax===undefined)throw Error('Fichier non reconnu');data={...structuredClone(initial),...d};for(const k of ['passives','legendary','customStats','abilities','attacks','transformations'])if(!Array.isArray(data[k]))data[k]=[];data.hpMax=String(data.hpMax);data.hp=String(data.hp);if(data.activeTransformation===undefined)data.activeTransformation=null;editing=false;save();render();alert('Fiche importée !')}catch(err){alert('Import impossible : '+err.message)}e.target.value=''};
// Déplacement du popover : Owlbear ne permet pas de déplacer son iframe directement.
// On le ferme puis le rouvre à une nouvelle position à la fin du glisser-déposer.
const params=new URLSearchParams(location.search);
let anchorX=Number(params.get('x'))||440,anchorY=Number(params.get('y'))||100;
let dragStart=null;
const handle=$('#drag');
handle.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;dragStart={x:e.clientX,y:e.clientY};handle.setPointerCapture(e.pointerId)});
handle.addEventListener('pointerup',async e=>{
 if(!dragStart)return;
 const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;dragStart=null;
 if(!obr||!tokenId||Math.abs(dx)+Math.abs(dy)<12)return;
 const x=Math.max(10,Math.min(window.screen.availWidth-180,anchorX+dx));
 const y=Math.max(10,Math.min(window.screen.availHeight-120,anchorY+dy));
 const id='fr.arene.fiches/pion-'+tokenId;
 try{await obr.popover.close(id);await obr.popover.open({id,url:'fiche.html?item='+encodeURIComponent(tokenId)+'&x='+Math.round(x)+'&y='+Math.round(y),width:390,height:650,anchorPosition:{left:x,top:y},anchorReference:'POSITION',disableClickAway:true})}catch(err){console.error(err)}
});
handle.addEventListener('pointercancel',()=>dragStart=null);
render();
(async()=>{
  if(!tokenId){document.querySelector('#status').textContent='Aperçu local : pour associer une fiche, ouvrez-la depuis un pion dans Owlbear Rodeo.';return}
  try{
    const mod=await import('https://esm.sh/@owlbear-rodeo/sdk@2');obr=mod.default;
    await new Promise(resolve=>obr.onReady(resolve));
    const items=await obr.scene.items.getItems([tokenId]);
    if(!items.length)throw Error('Pion introuvable');
    const item=items[0], stored=item.metadata['fr.arene.fiches/data'];
    if(stored && typeof stored==='object')data={...structuredClone(initial),...stored};
    else {data={...structuredClone(initial),name:item.name||'Nouveau personnage'};await obr.scene.items.updateItems([tokenId],items=>{items[0].metadata['fr.arene.fiches/data']=JSON.parse(JSON.stringify(data))})}
    for(const k of ['attacks','passives','abilities','legendary','customStats','transformations'])if(!Array.isArray(data[k]))data[k]=[];
    document.querySelector('#status').textContent='✓ Fiche liée au pion « '+(item.name||'Sans nom')+' » — sauvegarde automatique.';
    document.querySelector('#sheet').style.left='12px';document.querySelector('#sheet').style.top='56px';
    document.querySelector('#sheet').style.width='calc(100% - 24px)';
    document.querySelector('#sheet').style.maxWidth='420px';
    document.querySelector('#sheet').querySelector('.body').style.maxHeight='calc(100vh - 145px)';
    render();
  }catch(e){document.querySelector('#status').textContent='⚠ Liaison Owlbear impossible : '+e.message}
})();
